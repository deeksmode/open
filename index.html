<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>Opening in Obsidian…</title>
<style>body{font:17px -apple-system,system-ui,sans-serif;background:#111;color:#eee;display:flex;min-height:100vh;align-items:center;justify-content:center;margin:0;text-align:center}a{display:inline-block;margin-top:14px;padding:12px 22px;border-radius:10px;background:#7c5cff;color:#fff;text-decoration:none}</style>
</head><body><div><div id="msg">Opening in Obsidian…</div><a id="btn" href="#" hidden>Open in Obsidian</a></div>
<script>
// Bridge: https link (tappable in chat apps) -> obsidian://open?<fragment>.
// The note path lives after '#', which browsers never send to this server.
(function(){
  var q = location.hash.slice(1);
  var ok = /^vault=[^&#]+&file=[^#]+$/.test(q);
  var msg = document.getElementById('msg'), btn = document.getElementById('btn');
  if (!ok) { msg.textContent = 'Nothing to open.'; return; }
  var url = 'obsidian://open?' + q;
  btn.href = url; btn.hidden = false;
  location.replace(url);
  setTimeout(function(){ msg.textContent = "If Obsidian didn't open, tap below. (If it opens but can't find the note, let the vault sync from iCloud and try again.)"; }, 1200);
})();
</script></body></html>
